<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>AI Chatbot</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/style.css') }}">

</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">

AI Assistant

</div>

<button id="newChat">

+ New Chat

</button>

<div id="history">

</div>

</div>

<div class="chat-section">

<div id="chatBox">

<div class="bot-message">

Hello 👋

How can I help you?

</div>

</div>

<div class="input-area">

<button id="voiceBtn">

🎤

</button>

<input
type="text"
id="userInput"
placeholder="Type your message">

<button id="sendBtn">

Send

</button>

</div>

</div>

</div>

<script src="{{ url_for('static',
filename='js/app.js') }}">

</script>

</body>

</html>
