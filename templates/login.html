<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Chatbot Login</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

<div class="auth-card">

<h1>AI Chatbot</h1>

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

<a href="/register">
Create Account
</a>

</form>

</div>

</div>

</body>
</html>
